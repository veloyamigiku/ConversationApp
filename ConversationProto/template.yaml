AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  TargetTableName:
    Type: String
    Default: "ConversationProto"

Resources:
  
  MyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: langchain-google
      Description: langchain-google-library
      ContentUri: ../Layer/LangChainGoogle
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.10
  MyLayer2:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: fastapi
      Description: fastapi-library
      ContentUri: ../Layer/FastAPI
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.10
  MyMinimalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: conversationproto
      FunctionName: myminimalfunction
      Handler: app.handler
      Runtime: python3.10
      Timeout: 29
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TargetTableName
        - Statement:
            - Effect: Allow
              Action: "lambda:InvokeFunction"
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:myminimalfunction"
      Layers:
        - !Ref MyLayer
        - !Ref MyLayer2
      Environment:
        Variables:
          GOOGLE_API_KEY: "(google_api_key)"
      Events:
        RootPathRoute:
          Type: Api
          Properties:
            Path: /
            Method: ANY
            RestApiId: !Ref AsyncApi
        ProxyPathRoute:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref AsyncApi
  
  ConfigLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MyMinimalFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AsyncApi}/*"
  
  AsyncApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
  
Outputs:
  MyMinimalFunction:
    Value: !GetAtt MyMinimalFunction.Arn
  MyMinimalFunctionRole:
    Value: !GetAtt MyMinimalFunctionRole.Arn
