version = 0.1

[default.deploy.parameters]
stack_name = "ConversationProto"
resolve_s3 = true
s3_prefix = "ConversationProto"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []
disable_rollback = true
parameter_overrides = "TargetTableName=\"ConversationProto\" ParameterGeminiAPIKey=\"/conversation-app/conversation-proto/gemini-api-key\""

[default.global.parameters]
region = "ap-northeast-1"
